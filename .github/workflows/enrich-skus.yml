name: Completeaza SKU Linella
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Diagnostic test only: maximum 10 products (1-10)'
        default: '10'
        type: string
      after:
        description: 'Resume after product ID from previous result; empty for start'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: linella-catalog-import
  cancel-in-progress: false
jobs:
  sku:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements.lock
      - name: Complete only missing SKU identifiers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKU_LIMIT: ${{ inputs.limit }}
          SKU_AFTER: ${{ inputs.after }}
          PYTHONUNBUFFERED: '1'
        run: |
          case "$SKU_LIMIT" in
            [1-9]|10) ;;
            *) echo '::error::Diagnostic workflow permits only 1-10 products.'; exit 1 ;;
          esac
          python -m app.cli diagnose-skus --after "$SKU_AFTER" --render-url https://preturi-linella.onrender.com
          python -m app.cli enrich-skus --limit "$SKU_LIMIT" --after "$SKU_AFTER"
