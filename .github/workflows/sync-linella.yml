name: Import Linella

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full HTML discovery or a bounded selective update'
        type: choice
        options: [full, selective]
        default: full
      search_api:
        description: 'Enable supplemental Search API for this run'
        type: boolean
        default: false
      age_confirmed:
        description: 'I confirm I am at least 18 and authorize the official Linella age form'
        type: boolean
        default: false
      query:
        description: 'Selective mode only: concrete query, e.g. red bull'
        type: string
        default: ''
      category:
        description: 'Selective mode only: existing category path, e.g. /bauturi/energizante/'
        type: string
        default: ''
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: linella-catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - name: Download source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Import catalog into PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_CONCURRENCY: '4'
          SCRAPER_INTERVAL_SECONDS: '0.5'
          PYTHONUNBUFFERED: '1'
          LINELLA_AGE_CONFIRMED: ${{ github.event.inputs.age_confirmed == 'true' && 'true' || vars.LINELLA_AGE_CONFIRMED || 'false' }}
          LINELLA_SEARCH_API_ENABLED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.search_api || vars.LINELLA_SEARCH_API_ENABLED || 'false' }}
          LINELLA_SEARCH_SELECTIONS: ${{ vars.LINELLA_SEARCH_SELECTIONS || '[]' }}
          RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
          SEARCH_QUERY: ${{ github.event.inputs.query || '' }}
          SEARCH_CATEGORY: ${{ github.event.inputs.category || '' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::Add the DATABASE_URL repository secret before running this workflow.'
            exit 1
          fi
          case "$RUN_MODE" in
            full) python -m app.cli sync-linella ;;
            selective)
              if [ -z "$SEARCH_QUERY" ] || [ -z "$SEARCH_CATEGORY" ]; then
                echo '::error::Selective mode requires query and category.'
                exit 1
              fi
              python -m app.cli sync-selected --query "$SEARCH_QUERY" --category "$SEARCH_CATEGORY"
              ;;
            *) echo '::error::Invalid run mode.'; exit 1 ;;
          esac
          python -m app.cli diagnose-skus
